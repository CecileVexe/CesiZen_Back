name: 🚀 Build and deploy
run-name: ${{ github.actor }} is deploying with GitHub Actions 🚀
on:
  push:

jobs:
  test:
    permissions:
      checks: write
      pull-requests: write
      contents: write 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          cache: 'npm'
      - uses: ArtiomTr/jest-coverage-report-action@v2
        id: coverage
     with:
        annotations: none
        package-manager: npm
        test-script: npm run test:cov
        icons: emoji 
    # steps:
    #   - run: echo "Lancement des tests"
    #   - name: Check out repository code
    #     uses: actions/checkout@v4
    #   - run: echo "Le code du dépôt a été cloné sur le serveur d'exécution."
    #   - run: npm clean-install
    #   - run: npm run test:cov

  build:
    runs-on: ubuntu-latest
    needs:
    - test
    steps:
      - run: echo "Lancement des étapes de construction"
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "Le code du dépôt a été cloné sur le serveur d'exécution."
      - run: npm clean-install
      - run: npm run build
      - name: Save cache (node_modules)
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            /home/runner/.cache/Cypress
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}
      - run : echo "🏁 Étapes de construction terminées"

  build-push-docker :
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env: 
