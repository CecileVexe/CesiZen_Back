      ENV_DATABASE: cesizen
      ENV_USER: leadAdmin
      ENV_PASSWORD: leadAdminP@55w0rd
    needs:
    - test
    steps:
    - uses: actions/checkout@v4 #recupérer le code
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}
    - name: Build and push docker
      uses: docker/build-push-action@v6
      with: 
        context : .
        push: true
        target: cesizen-backend #nom de l'image concerné dans le Dockerfile
        tags: ghcr.io/cecilevexe/cesizen_back/cesizen_back:recette #avec le tag du nom de la branche sur laquelle on a push
  
