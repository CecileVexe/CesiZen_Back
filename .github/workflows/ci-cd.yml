name: CI/CD

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release, security]
  workflow_dispatch:

permissions:
  contents: read

# Un seul run par branche ; un déploiement en cours sur release n'est jamais annulé
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Échoue sur toute faille haute ou critique absente de la liste d'exceptions (audit-ci.jsonc)
      - name: Audit des dépendances
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

  build:
    name: build
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run build

  deploy:
    name: deploy
    needs: [security-audit, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      # Le Deploy Hook redéploie le service Render configuré sur la branche release
      - name: Déploiement sur Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Le secret RENDER_DEPLOY_HOOK_URL n'est pas configuré"
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL" --output /dev/null
          echo "Déploiement Render déclenché"
